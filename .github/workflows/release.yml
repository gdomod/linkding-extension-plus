name: Build & Release

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.15.1, etc.
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Package ZIP
        run: |
          ZIP_NAME="linkding-plus-${{ steps.version.outputs.version }}.zip"
          zip -r "$ZIP_NAME" manifest.json build icons options popup styles
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            ## Installation

            1. Download `${{ env.ZIP_NAME }}` below
            2. Go to `chrome://extensions/` → enable **Developer mode**
            3. Drag & drop the ZIP file onto the extensions page

            Or upload to the [Chrome Web Store Developer Dashboard](https://chrome.google.com/webstore/devconsole).
