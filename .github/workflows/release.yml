name: Build & Release

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.15.1, etc.
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write   # required to create GitHub Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Package ZIP
        id: package
        run: |
          ZIP_NAME="linkding-extension-plus-${{ steps.version.outputs.version }}.zip"
          zip -r "$ZIP_NAME" manifest.json build icons options popup styles
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_name }}
          generate_release_notes: false
          body: |
            ## Installation

            **Chrome Web Store (empfohlen):**
            [![Chrome Web Store](https://img.shields.io/chrome-web-store/v/kaaecpjmmcibecogckkeegljhjkpjllh?label=Chrome%20Web%20Store&logo=googlechrome&logoColor=white&color=4285F4)](https://chromewebstore.google.com/detail/linkding-extension-plus/kaaecpjmmcibecogckkeegljhjkpjllh)

            **Manuell (Unpacked):**
            1. `${{ steps.package.outputs.zip_name }}` unten herunterladen
            2. `chrome://extensions/` öffnen → **Entwicklermodus** aktivieren
            3. ZIP auf die Seite ziehen
